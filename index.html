<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scénario 1 : Étouffement</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; overflow-x: hidden; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slide-in { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slide-up { from { opacity: 0; transform: translateY(20px) translateX(-50%); } to { opacity: 1; transform: translateY(0) translateX(-50%); } }
        .animate-fade-in { animation: fade-in 0.5s ease-out; }
        .animate-slide-in { animation: slide-in 0.5s ease-out; }
        .animate-slide-up { animation: slide-up 0.4s ease-out; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>
        let etape=-1,score=0,feedback='',showFeedback=false,reponseSelectionnee=null,reponseValidee=false,nomJoueur='',nomTemporaire='';const backgrounds=['bg-gradient-to-br from-indigo-100 to-purple-100','bg-gradient-to-br from-blue-100 to-purple-100','bg-gradient-to-br from-amber-50 to-orange-50','bg-gradient-to-br from-red-50 to-pink-100','bg-gradient-to-br from-cyan-50 to-blue-100','bg-gradient-to-br from-orange-50 to-amber-100','bg-gradient-to-br from-yellow-50 to-amber-50','bg-gradient-to-br from-red-50 to-rose-100','bg-gradient-to-br from-green-50 to-emerald-100','bg-gradient-to-br from-blue-50 to-indigo-100','bg-gradient-to-br from-purple-50 to-pink-100'];function afficherFeedback(e,t,a){feedback=e,showFeedback=!0,t&&(score+=a),render(),setTimeout(()=>{showFeedback=!1,etape++,reponseSelectionnee=null,reponseValidee=!1,render()},4e3)}function selectionnerReponse(e){reponseValidee||(reponseSelectionnee=e,render())}function validerReponse(e,t,a,n){if(null===reponseSelectionnee)return feedback='⚠️ Veuillez sélectionner une réponse avant de valider',showFeedback=!0,render(),void setTimeout(()=>{showFeedback=!1,render()},2e3);reponseValidee=!0,reponseSelectionnee===e?afficherFeedback(t,!0,n):afficherFeedback(a,!1,0)}function commencerJeu(){if(''===nomTemporaire.trim())return feedback='⚠️ Veuillez entrer votre nom pour commencer',showFeedback=!0,render(),void setTimeout(()=>{showFeedback=!1,render()},2e3);nomJoueur=nomTemporaire.trim(),etape=0,render()}function getBadge(e){return e>=100?{icon:'🥇',titre:'EXPERT',message:'Performance exceptionnelle !',color:'from-yellow-500 to-amber-600'}:e>=80?{icon:'🥈',titre:'COMPÉTENT',message:'Très bonne maîtrise !',color:'from-gray-400 to-gray-600'}:e>=60?{icon:'🥉',titre:'EN APPRENTISSAGE',message:'Continuez à vous entraîner',color:'from-orange-500 to-red-600'}:{icon:'📚',titre:'À REVOIR',message:'Révisez les protocoles',color:'from-blue-500 to-indigo-600'}}function getBoutonStyle(e,t){const a='w-full py-4 px-6 rounded-lg text-left transition-all duration-300 cursor-pointer ';if(!reponseValidee)return a+(reponseSelectionnee===e?'border-4 border-blue-500 bg-blue-50 transform scale-105 shadow-lg':'border-2 border-gray-300 bg-white hover:bg-gray-50 hover:shadow-md');return{2:'B',3:'C',4:'A',6:'B',8:'B'}[t]===e?a+'border-4 border-green-500 bg-green-50':a+'border-2 border-gray-300 bg-gray-100'}function renderQuestion(e,t,a,n,r,o,s,l,i=''){return`<div class="space-y-6 animate-fade-in"><div class="bg-gradient-to-r ${l} text-white p-5 rounded-xl shadow-lg"><p class="font-bold text-xl flex items-center"><svg class="mr-3" width="28" height="28" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>${e}</p><p class="text-sm mt-2 opacity-90">${t}</p></div>${i}<div class="space-y-3">${a.map(e=>`<button onclick="selectionnerReponse('${e.lettre}')" class="${getBoutonStyle(e.lettre,etape)}"><span class="font-bold text-lg">${e.lettre})</span> ${e.texte}</button>`).join('')}</div><div class="pt-4 border-t border-gray-200"><button onclick="validerReponse('${n}', \`${r}\`, \`${o}\`, ${s})" class="w-full py-4 rounded-xl font-bold text-lg transition-all ${reponseSelectionnee?'bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-700 hover:to-emerald-700':'bg-gray-400 cursor-not-allowed'} text-white shadow-lg flex items-center justify-center" ${reponseSelectionnee?'':'disabled'}><svg class="mr-3" width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>VALIDER MA RÉPONSE</button></div></div>`}function renderEtape(){switch(etape){case-1:return`<div class="text-center space-y-8 animate-fade-in"><div class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-8 px-8 rounded-2xl shadow-2xl"><div class="flex items-center justify-center mb-4"><svg class="mr-3" width="48" height="48" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg><h1 class="text-4xl font-bold">BIENVENUE !</h1></div><p class="text-xl opacity-90">Jeu Sérieux de Formation aux Premiers Secours</p></div><div class="bg-white/90 backdrop-blur-sm p-8 rounded-2xl shadow-lg border border-white/20"><div class="mb-6"><svg class="mx-auto mb-4 text-indigo-600" width="64" height="64" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg><h2 class="text-2xl font-bold text-gray-800 mb-2">Identifiez-vous</h2><p class="text-gray-600">Votre nom apparaîtra sur votre certificat</p></div><div class="mb-6"><label class="block text-left font-semibold text-gray-700 mb-3">Entrez votre nom complet :</label><input type="text" id="nomInput" value="${nomTemporaire}" placeholder="Ex: Ahmed Alami" class="w-full px-6 py-4 text-lg border-2 border-gray-300 rounded-xl focus:border-indigo-500 focus:outline-none transition-all" maxlength="50" onkeypress="if(event.key==='Enter') commencerJeu()"/><p class="text-sm text-gray-500 mt-2 text-left">${nomTemporaire.length}/50 caractères</p></div><button onclick="commencerJeu()" class="w-full py-4 px-8 rounded-xl font-bold text-lg transition-all shadow-lg flex items-center justify-center ${''===nomTemporaire.trim()?'bg-gray-400 cursor-not-allowed text-white':'bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white transform hover:scale-105'}">COMMENCER LA FORMATION<svg class="ml-2" width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></button></div><div class="bg-yellow-50/80 backdrop-blur-sm border-l-4 border-yellow-500 p-6 rounded-xl"><p class="font-bold text-yellow-800 text-lg mb-2">📌 Information</p><p class="text-yellow-700">Cette formation vous apprendra les gestes qui sauvent. Durée : 5-10 minutes.</p></div></div>`;case 0:return`<div class="text-center space-y-6 animate-fade-in"><div class="bg-gradient-to-r from-red-600 to-red-700 text-white py-6 px-8 rounded-2xl shadow-2xl"><h1 class="text-4xl font-bold mb-2">🚨 URGENCES - AGIR POUR SAUVER</h1><p class="text-2xl mt-2 font-semibold">Scénario 1 : ÉTOUFFEMENT</p></div><div class="bg-white/80 backdrop-blur-sm p-8 rounded-2xl shadow-lg"><div class="bg-indigo-100 border-l-4 border-indigo-500 p-4 rounded-lg mb-6"><p class="font-bold text-indigo-800">Apprenant : ${nomJoueur}</p></div><p class="text-2xl mb-6 font-bold text-gray-800">Niveau : <span class="text-green-600">FACILE</span></p><p class="text-lg text-gray-700 mb-6">Gérez une situation d'étouffement. Sélectionnez et validez vos réponses.</p></div><button onclick="etape=1;render();" class="bg-gradient-to-r from-red-600 to-orange-600 hover:from-red-700 hover:to-orange-700 text-white font-bold py-4 px-12 rounded-2xl transition-all transform hover:scale-105 shadow-xl text-xl">COMMENCER LE SCÉNARIO</button></div>`;case 1:return`<div class="space-y-6 animate-slide-in"><div class="bg-white/90 p-8 rounded-2xl shadow-xl"><div class="flex items-center justify-center mb-6"><div class="w-40 h-40 bg-gradient-to-br from-red-200 to-pink-200 rounded-full flex items-center justify-center shadow-inner animate-pulse"><span class="text-8xl">😰</span></div></div><div class="text-center mb-6"><p class="text-2xl font-bold text-red-600 mb-4">SCÈNE : RESTAURANT</p><div class="bg-gray-100 p-4 rounded-xl mb-4"><p class="text-xl font-bold text-gray-800 mb-2">Une personne porte les mains à sa gorge !</p><p class="text-gray-600 italic">Elle ne peut plus parler et son visage rougit...</p></div></div></div><button onclick="etape=2;render();" class="w-full bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-700 hover:to-cyan-700 text-white font-bold py-4 px-6 rounded-xl transition-all shadow-lg">OBSERVER LA SITUATION</button></div>`;case 2:return renderQuestion('QUE SE PASSE-T-IL ?','Analysez la situation',[{lettre:'A',texte:'La personne tousse légèrement'},{lettre:'B',texte:'La personne s\'étouffe (obstruction totale)'},{lettre:'C',texte:'Crise cardiaque'},{lettre:'D',texte:'Fait semblant'}],'B','✓ CORRECT ! Signes d\'obstruction totale identifiés.','⚠ Les signes indiquent une obstruction TOTALE.',20,'from-yellow-400 to-orange-500');case 3:return renderQuestion('PREMIÈRE ACTION ?','Sélectionnez puis validez',[{lettre:'A',texte:'Donner à boire'},{lettre:'B',texte:'Taper dans le dos'},{lettre:'C',texte:'Demander "Vous étouffez-vous ?"'},{lettre:'D',texte:'Appeler secours d\'abord'}],'C','✓ PARFAIT ! Toujours ÉVALUER d\'abord.','⚠ Il faut d\'abord ÉVALUER la gravité.',20,'from-blue-500 to-cyan-600');case 4:return renderQuestion('⚠️ La victime ne peut pas répondre !','ACTION IMMÉDIATE ?',[{lettre:'A',texte:'5 claques dorsales'},{lettre:'B',texte:'Mettre allongée'},{lettre:'C',texte:'Compressions abdominales'},{lettre:'D',texte:'Attendre'}],'A','✓ EXCELLENT ! Protocole : 5 claques dorsales d\'abord.','⚠ Protocole : d\'abord 5 CLAQUES DORSALES.',30,'from-orange-500 to-red-600');case 5:return`<div class="space-y-8 animate-fade-in"><div class="bg-white/90 p-8 rounded-2xl shadow-xl text-center"><div class="text-8xl mb-6 animate-bounce">👊</div><div class="bg-gradient-to-r from-orange-100 to-amber-100 p-6 rounded-xl mb-6"><p class="text-2xl font-bold text-gray-800 mb-2">5 CLAQUES DORSALES...</p><p class="text-gray-600">Entre les omoplates</p></div><div class="flex justify-center space-x-3">${[1,2,3,4,5].map(e=>`<div class="w-16 h-16 bg-gradient-to-br from-orange-500 to-red-500 rounded-full flex items-center justify-center text-white font-bold text-2xl shadow-lg animate-pulse">${e}</div>`).join('')}</div></div><button onclick="etape=6;render();" class="w-full bg-gradient-to-r from-orange-600 to-red-600 text-white font-bold py-4 px-6 rounded-xl">CONTINUER</button></div>`;case 6:return renderQuestion('⚠️ Claques inefficaces !','QUE FAIRE ?',[{lettre:'A',texte:'Recommencer claques'},{lettre:'B',texte:'5 compressions (Heimlich)'},{lettre:'C',texte:'Appeler et attendre'},{lettre:'D',texte:'Coups sur ventre'}],'B','✓ PARFAIT ! Heimlich correctement appliquée. Objet expulsé !','⚠ Il faut passer aux COMPRESSIONS ABDOMINALES.',30,'from-red-600 to-rose-700');case 7:return`<div class="space-y-8 animate-fade-in"><div class="bg-gradient-to-r from-green-500 to-emerald-600 p-8 rounded-2xl text-center border-4 border-white/30"><div class="text-9xl mb-6 animate-bounce">🎉</div><p class="text-3xl font-bold text-white mb-4">L'OBJET EST EXPULSÉ !</p><div class="bg-white/20 p-6 rounded-xl"><p class="text-xl text-white">Victime sauvée</p></div></div><button onclick="etape=8;render();" class="w-full bg-gradient-to-r from-green-600 to-emerald-700 text-white font-bold py-4 px-6 rounded-xl">DERNIÈRE ÉTAPE</button></div>`;case 8:return renderQuestion('📞 APPEL AUX SECOURS','Numéro au Maroc ?',[{lettre:'A',texte:'177 (Pompiers)'},{lettre:'B',texte:'150 (SAMU Maroc)'},{lettre:'C',texte:'141 (Police)'},{lettre:'D',texte:'190 (Ambulance)'}],'B','✓ PARFAIT ! 150 = SAMU Maroc pour urgences médicales.','⚠ Pour l\'étouffement au Maroc : 150 (SAMU).',20,'from-blue-600 to-indigo-700','<div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded-lg mb-4"><p class="text-sm text-blue-800"><strong>🇲🇦 Urgences Maroc :</strong> 150 (SAMU), 15 (Protection civile)</p></div>');case 9:const e=getBadge(score);return`<div class="space-y-8 animate-fade-in"><div class="bg-gradient-to-br from-purple-600 via-blue-600 to-cyan-600 text-white p-10 rounded-3xl text-center"><h2 class="text-4xl font-bold mb-2">CERTIFICAT</h2><div class="bg-white/20 p-8 rounded-2xl mb-6"><p class="text-sm opacity-80 mb-2">Attribué à</p><div class="bg-white/30 py-4 px-6 rounded-xl mb-4"><p class="text-3xl font-bold">${nomJoueur}</p></div></div><div class="bg-white/20 p-8 rounded-2xl mb-6"><p class="text-6xl font-bold mb-4">${score}/120</p><div class="w-full bg-white/30 h-4 rounded-full mt-4"><div class="bg-gradient-to-r from-green-400 to-emerald-500 h-full rounded-full" style="width:${score/120*100}%"></div></div><p class="text-lg mt-3">${(score/120*100).toFixed(0)}% réussite</p></div><div class="bg-gradient-to-r ${e.color} p-8 rounded-2xl"><p class="text-8xl mb-4">${e.icon}</p><p class="text-3xl font-bold mb-2">${e.titre}</p><p class="text-xl">${e.message}</p></div></div><div class="bg-white/90 p-8 rounded-2xl"><h3 class="font-bold text-2xl mb-6">📋 PROTOCOLE</h3>${[{s:'1. Reconnaître',d:'Mains à la gorge'},{s:'2. Évaluer',d:'Demander "Vous étouffez-vous ?"'},{s:'3. Agir',d:'5 claques dorsales'},{s:'4. Si échec',d:'5 compressions (Heimlich)'},{s:'5. Alerter',d:'150 (SAMU Maroc)'}].map((e,t)=>`<div class="flex items-start bg-gray-50 p-4 rounded-xl mb-3"><div class="bg-gradient-to-r from-blue-500 to-cyan-500 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold mr-4">${t+1}</div><div><p class="font-bold text-lg">${e.s}</p><p class="text-gray-600">${e.d}</p></div></div>`).join('')}</div><div class="flex gap-4"><button onclick="recommencer()" class="flex-1 bg-gradient-to-r from-blue-600 to-cyan-600 text-white font-bold py-4 px-6 rounded-xl">🔄 RECOMMENCER</button><button onclick="alert('Scénario 2 à venir')" class="flex-1 bg-gradient-to-r from-green-600 to-emerald-600 text-white font-bold py-4 px-6 rounded-xl">SCÉNARIO 2 →</button></div></div>`;default:return'Chargement...'}}function recommencer(){etape=-1,score=0,reponseSelectionnee=null,reponseValidee=!1,nomJoueur='',nomTemporaire='',render()}function render(){const e=document.getElementById('root'),t=backgrounds[etape+1]||backgrounds[0],a=etape>=0?`<div class="bg-white/80 rounded-2xl shadow-2xl p-6 mb-6"><div class="flex justify-between items-center mb-4"><div class="flex items-center"><div class="bg-gradient-to-r from-red-500 to-pink-500 p-2 rounded-xl mr-3"><svg width="28" height="28" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div><div><span class="font-bold text-2xl text-gray-800">${score}</span><span class="text-gray-600 ml-2">points</span></div></div><div class="text-right"><div class="text-sm text-gray-600 mb-1">Progression</div><div class="text-xl font-bold text-gray-800">Étape ${etape}/9</div></div></div><div class="w-full bg-gray-200/70 rounded-full h-3"><div class="bg-gradient-to-r from-red-500 to-orange-500 h-3 rounded-full transition-all duration-700" style="width:${etape/9*100}%"></div></div></div>`:'',n=showFeedback?`<div class="fixed bottom-6 left-1/2 transform -translate-x-1/2 max-w-2xl w-full ${feedback.includes('✓')?'bg-gradient-to-r from-green-100 to-emerald-100 border-green-400':'bg-gradient-to-r from-orange-100 to-amber-100 border-orange-400'} border-2 p-6 rounded-2xl shadow-2xl animate-slide-up z-50"><div class="flex items-start">${feedback.includes('✓')?'<div class="bg-gradient-to-r from-green-500 to-emerald-500 p-2 rounded-full mr-4"><svg width="28" height="28" fill="currentColor" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg></div>':'<div class="bg-gradient-to-r from-orange-500 to-amber-500 p-2 rounded-full mr-4"><svg width="28" height="28" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg></div>'}<div><p class="font-bold text-lg mb-2">${feedback.includes('✓')?'BONNE RÉPONSE !':'À CORRIGER'}</p><p class="text-gray-700">${feedback.replace(/^[✓⚠]\s*/,'')}</p></div></div></div>`:'';if(e.innerHTML=`<div class="min-h-screen ${t} transition-all duration-1000 p-4"><div class="max-w-3xl mx-auto">${a}<div class="bg-white/80 rounded-2xl shadow-2xl p-8">${renderEtape()}</div>${n}</div></div>`,-1===etape){const e=document.getElementById('nomInput');e&&(e.value=nomTemporaire,e.addEventListener('input',e=>{nomTemporaire=e.target.value,render()}),e.focus())}}render();
    </script>
</body>
</html>
